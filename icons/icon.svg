<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />
  
  <!-- Optical ring subtle decorative accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="16 12" opacity="0.35"/>
  
  <!-- Classic Snellen 'E' Optotype (5x5 grid proportions) -->
  <!-- Center is (256, 256). Size 220px. Unit = 44px -->
  <!-- Left bar: x=146 to 190, y=146 to 366 -->
  <!-- Top bar: x=146 to 366, y=146 to 190 -->
  <!-- Mid bar: x=146 to 330, y=234 to 278 -->
  <!-- Bot bar: x=146 to 366, y=322 to 366 -->
  <g filter="url(#shadow)">
    <path d="M 146 146 
             H 366 
             V 190 
             H 190 
             V 234 
             H 328 
             V 278 
             H 190 
             V 322 
             H 366 
             V 366 
             H 146 
             Z" 
          fill="#ffffff" />
  </g>
</svg>
